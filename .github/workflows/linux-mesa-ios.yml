name: linux-mesa-ios

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install llvm meson ninja spirv-llvm-translator spirv-tools bison
          python3 -m pip install --break-system-packages --user \
            mako packaging pyyaml
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build fresh Mesa 26.2.4 Panfrost iOS artifacts
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/out/linux-mesa-ios" \
            bash tools/linux-mesa-ios/build-ios-mesa.sh

      # Upload Mesa before building the test app. A bug in the app builder must
      # not discard a good Mesa build.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-mesa-g78
          path: out/linux-mesa-ios/
          if-no-files-found: error

      - name: Build S21IconProbe test app
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/out/s21-icon-probe" \
            bash tools/s21-icon-probe/build.sh

      - name: Upload S21IconProbe artifact
        uses: actions/upload-artifact@v4
        with:
          name: s21-icon-probe
          path: out/s21-icon-probe/
          if-no-files-found: error
